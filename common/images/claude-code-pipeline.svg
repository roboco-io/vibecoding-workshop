<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Stage 1: 컨텍스트 수집 -->
  <rect x="20" y="50" width="150" height="90" rx="10" fill="white" stroke="#333" stroke-width="2"/>
  <text x="95" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">컨텍스트 수집</text>
  <text x="95" y="105" text-anchor="middle" font-size="10" fill="#666">CLAUDE.md</text>
  <text x="95" y="120" text-anchor="middle" font-size="10" fill="#666">Git 상태, 환경 정보</text>

  <!-- Arrow 1→2 -->
  <line x1="175" y1="95" x2="200" y2="95" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 2: 프롬프트 빌드 -->
  <rect x="205" y="50" width="150" height="90" rx="10" fill="white" stroke="#333" stroke-width="2"/>
  <text x="280" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">프롬프트 빌드</text>
  <text x="280" y="105" text-anchor="middle" font-size="10" fill="#666">40+ 조각 동적 조합</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#666">정적/동적/조건부</text>

  <!-- Arrow 2→3 -->
  <line x1="360" y1="95" x2="385" y2="95" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 3: 요청 사전처리 -->
  <rect x="390" y="50" width="150" height="90" rx="10" fill="white" stroke="#333" stroke-width="2"/>
  <text x="465" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">요청 사전처리</text>
  <text x="465" y="105" text-anchor="middle" font-size="10" fill="#666">제목 생성, 주제 감지</text>
  <text x="465" y="120" text-anchor="middle" font-size="10" fill="#666">컨텍스트 요약</text>

  <!-- Arrow 3→4 -->
  <line x1="545" y1="95" x2="570" y2="95" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Stage 4: 응답 처리 -->
  <rect x="575" y="50" width="130" height="90" rx="10" fill="white" stroke="#333" stroke-width="2"/>
  <text x="640" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">응답 처리</text>
  <text x="640" y="105" text-anchor="middle" font-size="10" fill="#666">도구 실행</text>
  <text x="640" y="120" text-anchor="middle" font-size="10" fill="#666">보안 검증</text>

  <!-- Top label -->
  <text x="360" y="30" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Claude Code 4단계 파이프라인</text>

  <!-- Bottom: System Reminder -->
  <rect x="100" y="175" width="520" height="45" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="360" y="195" text-anchor="middle" font-size="12" fill="#666">&lt;system-reminder&gt; — 모든 단계에서 핵심 지침을 반복 주입하여 drift 방지</text>
  <text x="360" y="212" text-anchor="middle" font-size="10" fill="#999">Ephemeral Cache로 반복 프롬프트 캐싱 → 효율성 극대화</text>

  <!-- Dashed lines from stages to system-reminder -->
  <line x1="95" y1="145" x2="200" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="145" x2="300" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="465" y1="145" x2="430" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="145" x2="530" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
