<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Center hexagon -->
  <polygon points="360,140 420,170 420,230 360,260 300,230 300,170" fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>
  <text x="360" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">모던 SW</text>
  <text x="360" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">엔지니어링</text>

  <!-- Node 0: IaC (top-left) -->
  <rect x="60" y="30" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="120" y="56" text-anchor="middle" font-size="13" fill="#333">IaC</text>
  <line x1="175" y1="60" x2="305" y2="170" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 1: CI/CD (top) -->
  <rect x="300" y="30" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="360" y="56" text-anchor="middle" font-size="13" fill="#333">CI/CD</text>
  <line x1="360" y1="70" x2="360" y2="140" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 2: DevOps (top-right) -->
  <rect x="540" y="30" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#333">DevOps</text>
  <line x1="545" y1="60" x2="415" y2="170" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 3: Cloud Native (right) -->
  <rect x="540" y="180" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#333">클라우드</text>
  <text x="600" y="214" text-anchor="middle" font-size="11" fill="#333">네이티브</text>
  <line x1="540" y1="200" x2="425" y2="200" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 4: Microservices (bottom-right) -->
  <rect x="540" y="320" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="600" y="346" text-anchor="middle" font-size="13" fill="#333">마이크로서비스</text>
  <line x1="545" y1="330" x2="415" y2="235" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 5: Container (bottom) -->
  <rect x="300" y="320" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="360" y="346" text-anchor="middle" font-size="13" fill="#333">컨테이너화</text>
  <line x1="360" y1="320" x2="360" y2="265" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 6: Monitoring (bottom-left) -->
  <rect x="60" y="320" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="120" y="340" text-anchor="middle" font-size="11" fill="#333">모니터링</text>
  <text x="120" y="354" text-anchor="middle" font-size="11" fill="#333">&amp; 로깅</text>
  <line x1="175" y1="330" x2="305" y2="235" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Node 7: Security (left) -->
  <rect x="60" y="180" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="120" y="206" text-anchor="middle" font-size="13" fill="#333">보안 자동화</text>
  <line x1="180" y1="200" x2="295" y2="200" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
