<svg viewBox="0 0 740 360" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Start node -->
  <circle cx="50" cy="180" r="30" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  <text x="50" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">시작</text>

  <!-- Branch lines -->
  <path d="M 80 180 Q 110 180 120 100" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 80 180 Q 110 180 120 260" fill="none" stroke="#333" stroke-width="2"/>

  <!-- === TOP TRACK: Existing Project === -->
  <text x="130" y="45" font-size="14" font-weight="bold" fill="#333">기존 프로젝트</text>

  <!-- Step 1 -->
  <rect x="120" y="60" width="100" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="170" y="85" text-anchor="middle" font-size="12" fill="#333">코드베이스 분석</text>

  <line x1="220" y1="80" x2="235" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="245" y="60" width="80" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="285" y="85" text-anchor="middle" font-size="12" fill="#333">문서화</text>

  <line x1="325" y1="80" x2="340" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 3 -->
  <rect x="350" y="60" width="90" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="395" y="85" text-anchor="middle" font-size="12" fill="#333">테스트 작성</text>

  <line x1="440" y1="80" x2="455" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 4 -->
  <rect x="465" y="60" width="90" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="510" y="85" text-anchor="middle" font-size="12" fill="#333">CI/CD 구축</text>

  <!-- Connect to AI-DLC -->
  <path d="M 555 80 Q 590 80 610 130" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- === BOTTOM TRACK: New Project === -->
  <text x="130" y="240" font-size="14" font-weight="bold" fill="#333">신규 프로젝트</text>

  <!-- Step 1 -->
  <rect x="120" y="250" width="130" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="185" y="275" text-anchor="middle" font-size="12" fill="#333">AI-DLC 설계 도입</text>

  <line x1="250" y1="270" x2="265" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="275" y="250" width="130" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="340" y="275" text-anchor="middle" font-size="12" fill="#333">AI 협업 개발 시작</text>

  <!-- Connect to AI-DLC -->
  <path d="M 405 270 Q 540 270 610 210" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- === CONVERGENCE: AI-DLC === -->
  <rect x="590" y="140" width="130" height="70" rx="10" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
  <text x="655" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">AI-DLC</text>
  <text x="655" y="196" text-anchor="middle" font-size="11" fill="#666">지속적 AI 협업</text>

  <!-- Labels for tracks -->
  <rect x="120" y="115" width="440" height="24" rx="4" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="132" text-anchor="middle" font-size="10" fill="#999">사전 준비 단계 (AI가 효과적으로 일할 수 있는 환경 구축)</text>
</svg>
