<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Section 1: 개발 &amp; CI -->
  <text x="50" y="28" font-size="12" font-weight="bold" fill="#555">개발 &amp; CI</text>

  <!-- Box 1: 이슈 생성 -->
  <rect x="50" y="40" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="110" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">이슈 생성</text>
  <text x="110" y="94" text-anchor="middle" font-size="9" fill="#666">AI 생성·리뷰·지정</text>
  <text x="110" y="106" text-anchor="middle" font-size="9" fill="#666">조사 보고서 작성</text>

  <line x1="170" y1="60" x2="195" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 2: 개발 (TDD) -->
  <rect x="200" y="40" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">개발 (TDD)</text>
  <text x="260" y="94" text-anchor="middle" font-size="9" fill="#666">AI가 이슈 대응</text>
  <text x="260" y="106" text-anchor="middle" font-size="9" fill="#666">TDD 기반 구현</text>

  <line x1="320" y1="60" x2="345" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 3: pre-commit -->
  <rect x="350" y="40" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="410" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">pre-commit</text>
  <text x="410" y="94" text-anchor="middle" font-size="9" fill="#666">UT · Lint</text>
  <text x="410" y="106" text-anchor="middle" font-size="9" fill="#666">로컬 자동 실행</text>

  <line x1="470" y1="60" x2="495" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 4: pre-pull -->
  <rect x="500" y="40" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="560" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">pre-pull</text>
  <text x="560" y="94" text-anchor="middle" font-size="9" fill="#666">IT · E2E · Coverage</text>
  <text x="560" y="106" text-anchor="middle" font-size="9" fill="#666">CI 자동 실행</text>

  <line x1="620" y1="60" x2="645" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 5: PR &amp; 리뷰 -->
  <rect x="650" y="40" width="120" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="710" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">PR &amp; 리뷰</text>
  <text x="710" y="94" text-anchor="middle" font-size="9" fill="#666">AI 코드 리뷰</text>
  <text x="710" y="106" text-anchor="middle" font-size="9" fill="#666">변경사항 대응</text>

  <!-- Connecting polyline: Row 1 → Row 2 (exits right side of PR box) -->
  <polyline points="770,60 795,60 795,140 215,140 215,180" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section 2: 배포 (CD) -->
  <text x="50" y="168" font-size="12" font-weight="bold" fill="#555">배포 (CD)</text>

  <!-- Box 6: dev 배포 -->
  <rect x="135" y="180" width="160" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="215" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">dev 배포</text>
  <text x="215" y="234" text-anchor="middle" font-size="9" fill="#666">카나리 · 보안 스캔 · 성능</text>

  <line x1="295" y1="200" x2="325" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 7: staging 배포 -->
  <rect x="330" y="180" width="160" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="410" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">staging 배포</text>
  <text x="410" y="234" text-anchor="middle" font-size="9" fill="#666">카나리 · 보안 스캔 · 성능</text>

  <line x1="490" y1="200" x2="520" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box 8: prod 배포 -->
  <rect x="525" y="180" width="160" height="40" rx="6" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="605" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">prod 배포</text>
  <text x="605" y="234" text-anchor="middle" font-size="9" fill="#666">카나리 · 보안 스캔 · 성능</text>
</svg>
