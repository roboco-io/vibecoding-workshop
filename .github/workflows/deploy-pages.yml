name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build MARP slides
        run: |
          npx --yes @marp-team/marp-cli common/presentation.md -o common/presentation.html --allow-local-files
          npx @marp-team/marp-cli vibecoding-for-nondeveloper/presentation.md -o vibecoding-for-nondeveloper/presentation.html --allow-local-files

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Copy MARP output to _site
        run: |
          cp common/presentation.html _site/presentation.html
          mkdir -p _site/common/images
          cp -r common/images/* _site/common/images/
          mkdir -p _site/vibecoding-for-nondeveloper
          cp vibecoding-for-nondeveloper/presentation.html _site/vibecoding-for-nondeveloper/presentation.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
